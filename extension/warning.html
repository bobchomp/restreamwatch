<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heads up: use RTMP Web Player</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <main class="card">
    <img class="mark" src="icons/icon128.png" alt="" width="56" height="56">
    <h1>Restream titles are now updated in <span class="accent">RTMP Web Player</span>, rather than Restream.</h1>
    <a class="btn btn-primary" href="https://stream.rossmackenzie.co.uk">RTMP Web Player</a>
    <p class="subtitle">If, however, you are going to Restream for other purposes, feel free to continue!</p>
  </main>

  <button id="proceed" class="btn btn-secondary proceed" type="button">
    Proceed to Restream <span aria-hidden="true">&rarr;</span>
  </button>

  <script src="warning.js"></script>
</body>
</html>
