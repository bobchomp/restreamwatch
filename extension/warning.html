<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heads up: use RTMP Web Player</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <main class="card">
    <img class="mark" src="icons/icon128.png" alt="" width="56" height="56">
    <h1>We are no longer using Restream, everything is now run through <span class="accent">RTMP Web Player</span>, including YouTube and Facebook, any questions?</h1>
    <div class="actions">
      <button id="proceed" class="btn btn-secondary" type="button">
        Proceed to Restream <span aria-hidden="true">&rarr;</span>
      </button>
      <a class="btn btn-primary" href="https://stream.rossmackenzie.co.uk">RTMP Web Player</a>
    </div>
    <p class="subtitle">If, however, you are going to Restream for other purposes, feel free to continue!</p>
  </main>

  <script src="warning.js"></script>
</body>
</html>
